# 워크플로우 이름
name: GitOps CI Pipeline

# main 브랜치에 push되면 GitHub Actions 실행
on:
  push:
    branches: ["main"]

jobs:
  build-and-update:
    runs-on: ubuntu-latest

    steps:
      # GitHub Repository의 파일을 Actions 실행 환경으로 가져오기
      - name: 소스코드 가져오기
        uses: actions/checkout@v4

      # Docker Hub 로그인
      - name: Docker Hub 로그인
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # GitHub Actions가 AWS 명령어를 사용할 수 있도록 AWS 인증
      - name: AWS 자격 증명 설정
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # ECR에 로그인
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # ECR에 Docker 이미지 빌드 및 푸시
      - name: Build and push Docker image to ECR
        env:
          # ECR_REGISTRY: 925047940866.dkr.ecr.ap-northeast-1.amazonaws.com
          # ECR_REPOSITORY: std01-nginx
          IMAGE_TAG: 1.31.3-cd
        run: |
          docker build --no-cache -t 925047940866.dkr.ecr.ap-northeast-1.amazonaws.com/std01-nginx:$IMAGE_TAG ./nginx
          docker build --no-cache -t 925047940866.dkr.ecr.ap-northeast-1.amazonaws.com/std01-nginx:latest ./nginx

          docker push 925047940866.dkr.ecr.ap-northeast-1.amazonaws.com/std01-nginx:$IMAGE_TAG
          docker push 925047940866.dkr.ecr.ap-northeast-1.amazonaws.com/std01-nginx:latest

      # docker-compose.yaml 파일을 S3에 업로드
      - name: Docker Compose 파일 S3 업로드
        run: |
          aws s3 cp docker-compose.yaml s3://std01-static-web-0914/docker-compose.yaml

      # SSM을 통해 Private EC2에 Docker Compose 배포 명령 전달
      - name: Private EC2에 Docker Compose 배포
        # env:
        #   ECR_REGISTRY: 925047940866.dkr.ecr.ap-northeast-1.amazonaws.com
        #   ECR_REPOSITORY: std01-nginx
        #   IMAGE_TAG: latest
        run: |
          aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --targets "Key=tag:Cicd,Values=asg" \
            --parameters "commands=[
              \"sudo systemctl stop nginx || true\",
              \"sudo aws ecr get-login-password --region ap-northeast-1 | sudo docker login --username AWS --password-stdin 925047940866.dkr.ecr.ap-northeast-1.amazonaws.com\",
              \"sudo aws s3 cp s3://std01-static-web-0914/docker-compose.yaml /home/ec2-user/docker-compose.yaml\",
              \"sudo docker stop nginx-container || true\",
              \"sudo docker rm nginx-container || true\",
              \"sudo docker compose -f /home/ec2-user/docker-compose.yaml pull\",
              \"sudo docker compose -f /home/ec2-user/docker-compose.yaml up -d\"
            ]" \
            --region "${{ secrets.AWS_REGION }}" \
            --comment "Deploying Docker Compose from S3"